name: Website validation

on:
  pull_request:
    paths:
      - '.github/workflows/work-phase-1.yml'
      - 'src/**'
      - 'public/**'
      - 'AGENTS.md'
      - 'tests/**'
      - 'package.json'
      - 'astro.config.mjs'

permissions:
  contents: read

jobs:
  build-and-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve existing Solutions photograph for local hosting
        run: |
          node --input-type=module <<'JS'
          import { mkdirSync, writeFileSync } from 'node:fs';
          mkdirSync('artifacts/solutions-source', {recursive:true});
          const attempts=[];
          const original='https://unsplash.com/photos/teRVpNnlR_c/download?force=true&w=1600';
          let source;
          for (const url of [original,'https://unsplash.com/napi/photos/teRVpNnlR_c','https://unsplash.com/photos/teRVpNnlR_c']) {
            try {
              const r=await fetch(url,{signal:AbortSignal.timeout(15000)});
              const type=r.headers.get('content-type')||'';
              attempts.push({url,status:r.status,type});
              if(!r.ok)continue;
              if(type.startsWith('image/')){source={url:r.url,type,bytes:Buffer.from(await r.arrayBuffer())};break;}
              const text=await r.text();
              let candidate;
              if(type.includes('json')){const data=JSON.parse(text);candidate=data.urls?.regular||data.urls?.full;}
              else { const match=text.match(/<meta[^>]*property="og:image"[^>]*content="([^"]+)"/i)||text.match(/<meta[^>]*content="([^"]+)"[^>]*property="og:image"/i);candidate=match?.[1]?.replaceAll('&amp;','&');}
              if(candidate?.startsWith('https://images.unsplash.com/')){
                const asset=await fetch(candidate,{signal:AbortSignal.timeout(15000)});
                const assetType=asset.headers.get('content-type')||'';
                attempts.push({url:candidate,status:asset.status,type:assetType});
                if(asset.ok&&assetType.startsWith('image/')){source={url:candidate,type:assetType,bytes:Buffer.from(await asset.arrayBuffer())};break;}
              }
            } catch(e){attempts.push({url,error:e.message});}
          }
          if(source){writeFileSync('artifacts/solutions-source/photograph',source.bytes);delete source.bytes;}
          writeFileSync('artifacts/solutions-source/source.json',JSON.stringify({photoId:'teRVpNnlR_c',original,attempts,download:source||null},null,2));
          console.log('SOLUTIONS_DOWNLOAD',JSON.stringify({attempts,download:source||null}));
          JS
      - name: Save retrieved Solutions photograph
        uses: actions/upload-artifact@v4
        with:
          name: solutions-source-image
          path: artifacts/solutions-source/
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install the declared Astro dependency and browser test tooling
        run: npm install --no-save --package-lock=false playwright
      - name: Build the static site
        run: npm run build
      - name: Check content and filtering logic
        run: node --test --test-isolation=none tests/work.test.mjs tests/contact.test.mjs
      - name: Install the test browser
        run: npx playwright install --with-deps chromium
      - name: Verify uploaded static media
        run: node tests/media-assets.browser.mjs
      - name: Verify uploaded Impex media and playback
        run: node tests/impex.browser.mjs
      - name: Review rendered page and browser interactions
        run: node tests/work.browser.mjs
      - name: Audit the rendered Solutions page
        run: node tests/solutions.browser.mjs
      - name: Validate the About page
        run: node tests/about.browser.mjs
      - name: Validate the Contact page and form states
        run: node tests/contact.browser.mjs
      - name: Inspect the live Contact branch preview without submitting
        if: github.head_ref == 'feat/contact-page'
        run: node tests/contact.preview.mjs
      - name: Save desktop and mobile review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: work-phase-2-review
          path: artifacts/work-review/
          if-no-files-found: ignore
      - name: Save About page screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: about-page-review
          path: artifacts/about-review/
          if-no-files-found: ignore
      - name: Save Contact page screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contact-page-review
          path: artifacts/contact-review/
          if-no-files-found: ignore
      - name: Save real Contact preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contact-preview-review
          path: artifacts/contact-preview-review/
          if-no-files-found: ignore
      - name: Save Impex media review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: impex-media-review
          path: artifacts/impex-review/
          if-no-files-found: ignore
      - name: Save uploaded media review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uploaded-media-review
          path: artifacts/media-review/
          if-no-files-found: ignore
      - name: Save Solutions audit screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solutions-page-review
          path: artifacts/solutions-review/
          if-no-files-found: ignore
