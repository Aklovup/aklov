name: Website validation

on:
  pull_request:
    paths:
      - '.github/workflows/work-phase-1.yml'
      - 'src/**'
      - 'scripts/**'
      - '.gitignore'
      - 'public/**'
      - 'AGENTS.md'
      - 'tests/**'
      - 'package.json'
      - 'astro.config.mjs'

permissions:
  contents: read

jobs:
  build-and-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install the declared Astro dependency and browser test tooling
        run: npm install --no-save --package-lock=false playwright
      - name: Build the static site
        run: npm run build
      - name: Check content and filtering logic
        run: node --test --test-isolation=none tests/work.test.mjs tests/contact.test.mjs
      - name: Install the test browser
        run: npx playwright install --with-deps chromium
      - name: Review the editorial homepage
        run: node tests/home.browser.mjs
      - name: Verify uploaded static media
        run: node tests/media-assets.browser.mjs
      - name: Verify single images and bounded multi-image inspection
        run: node tests/project-images.browser.mjs
      - name: Verify uploaded Impex media and playback
        run: node tests/impex.browser.mjs
      - name: Review rendered page and browser interactions
        run: node tests/work.browser.mjs
      - name: Audit the rendered Solutions page
        run: node tests/solutions.browser.mjs
      - name: Validate sitewide refinements
        run: node tests/site-polish.browser.mjs
      - name: Validate the About page
        run: node tests/about.browser.mjs
      - name: Validate the Contact page and form states
        run: node tests/contact.browser.mjs
      - name: Inspect the live Contact branch preview without submitting
        if: github.head_ref == 'feat/contact-page'
        run: node tests/contact.preview.mjs
      - name: Save desktop and mobile review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: work-phase-2-review
          path: artifacts/work-review/
          if-no-files-found: ignore
      - name: Save About page screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: about-page-review
          path: artifacts/about-review/
          if-no-files-found: ignore
      - name: Save Contact page screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contact-page-review
          path: artifacts/contact-review/
          if-no-files-found: ignore
      - name: Save real Contact preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contact-preview-review
          path: artifacts/contact-preview-review/
          if-no-files-found: ignore
      - name: Save Impex media review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: impex-media-review
          path: artifacts/impex-review/
          if-no-files-found: ignore
      - name: Save uploaded media review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uploaded-media-review
          path: artifacts/media-review/
          if-no-files-found: ignore
      - name: Save Solutions audit screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solutions-page-review
          path: artifacts/solutions-review/
          if-no-files-found: ignore
      - name: Save sitewide review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sitewide-polish-review
          path: artifacts/site-polish-review/
          if-no-files-found: ignore
      - name: Save full-page image viewer review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-images-review
          path: artifacts/project-images/
          if-no-files-found: ignore

      - name: Save homepage review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-review
          path: artifacts/home-review/
          if-no-files-found: ignore
